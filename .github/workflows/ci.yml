# work-timeline's own gate: ruff + the test suite against the locked deps, and gitleaks over history
# through ci-kit's reusable workflow, called the way every consumer calls it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check --output-format=github .
      - name: tests
        run: uv run pytest -q

  gitleaks:
    name: gitleaks (secret scan)
    permissions:
      contents: read
      pull-requests: read
    uses: mjdevaccount/ci-kit/.github/workflows/gitleaks.yml@v1
    with:
      mode: history

  # The same code written twice fails the PR: ci-kit's `ci-dup-code` (jscpd behind a shrink-only
  # fingerprint baseline, .github/jscpd-baseline.json). A NEW clone >= 70 tokens / 7 lines between two
  # tracked files fails; a removed one may re-freeze smaller (`--write-baseline` refuses to grow).
  # Reports as "dup-code / lint".
  dup-code:
    uses: mjdevaccount/ci-kit/.github/workflows/dup-code.yml@v1
    with:
      args: --baseline .github/jscpd-baseline.json
