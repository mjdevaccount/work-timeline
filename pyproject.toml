[project]
name = "work-timeline"
version = "0.2.0"
description = "The ops.work contract (closed vocabulary + request models) and the one remote writer for it: open on entry, close on exit, never raises."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["work_timeline"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.15"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF002", "RUF022"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
